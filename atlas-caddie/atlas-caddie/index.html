<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Atlas Caddie</title><style>
:root{color-scheme:light dark;--green:#276849;--bg:#f1f4ef;--panel:#fff;--ink:#19352a;--line:#d6dfd5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#173e30;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 18px}header h1{margin:0;font-size:29px;letter-spacing:-1px}small,label{font-size:12px;opacity:.8}main{max-width:560px;margin:auto;padding:14px 14px 100px}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}h2{font-size:19px;margin:0 0 12px}label{display:block;margin-bottom:5px}input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;min-width:0;background:var(--panel);width:100%;min-height:44px}button{cursor:pointer;font-weight:600}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{grid-template-columns:repeat(3,1fr)}.clubs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.clubs button{padding:7px 2px}.clubs small{display:block}nav{position:fixed;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;width:100%;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px;z-index:5}nav button{border:0;font-size:13px}.big{font-size:30px;font-weight:750;letter-spacing:-1px}.muted{font-size:13px;opacity:.75}.warn{color:#a65c13;font-weight:600}.sp{margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:10px 3px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}svg{width:100%;max-height:310px;display:block}input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle}.clubedit{border-bottom:1px solid var(--line);padding:14px 0}@media(prefers-color-scheme:dark){:root{--bg:#101a15;--panel:#1b2a22;--ink:#edf4eb;--line:#3a5042}.warn{color:#ffc183}}
</style></head><body><header><small>PERSONAL COURSE MANAGEMENT</small><h1>⛳ Atlas Caddie</h1></header><main id="main"></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bagDefault=()=>[['D',240,260,300],['3W',218,228,240],['4i',178,190,205],['5i',183,193,200],['6i',178,188,195],['7i',163,173,180],['8i',148,158,165],['9i',133,143,150],['PW',123,128,135],['GW',110,115,125]].map(([name,carry,total,max])=>({name,carry,total,max,enabled:true,confidence:'Medium',shape:'Straight'}));
const holeDefault=(distance=350,par=4)=>({distance,par,target:par===3?0:par===5?220:115,shape:'Straight',corner:220,buffer:10,adjust:0,required:0,protect:true,manual:-1});
const initial=()=>({bag:bagDefault(),courses:[{name:'Elkhorn · Silver (provisional)',holes:[348,285,176,339,572,138,450,398,387,299,140,369,482,165,340,309,379,480].map((d,i)=>holeDefault(d,[4,4,3,4,5,3,5,4,4,4,3,4,5,3,4,4,4,5][i]))}],course:0,hole:0,quick:150});
let state;try{state=JSON.parse(localStorage.getItem('atlas-caddie-v1'))||initial()}catch(e){state=initial()}let page='Planner';const save=()=>{try{localStorage.setItem('atlas-caddie-v1',JSON.stringify(state))}catch(e){alert('Local saving unavailable. Export a backup.')}};const h=()=>state.courses[state.course].holes[state.hole];const valid=a=>a.carry>0&&a.total>=a.carry&&a.max>=a.total;const field=(label,key,value,type='number')=>`<div><label>${label}</label><input type="${type}" data-field="${key}" value="${esc(value)}"></div>`;const opts=(values,current)=>values.map(v=>`<option ${v==current?'selected':''}>${esc(v)}</option>`).join('');
function render(){ $('nav').innerHTML=['Planner','My Bag','Courses','Quick'].map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='Planner')planner();if(page==='My Bag')bag();if(page==='Courses')courses();if(page==='Quick')quick();}
function planner(){let a=h(),dog=a.par!=3&&a.shape!=='Straight',limit=dog?a.corner-a.buffer:Infinity,desired=a.par===3?a.distance+a.adjust:Math.min(a.distance-a.target,limit)+a.adjust;let safe=c=>valid(c)&&c.carry-a.adjust>=a.required&&(!dog||(a.protect?c.max:c.total)-a.adjust<=limit);let ranked=state.bag.map((c,i)=>({...c,i})).filter(c=>c.enabled&&safe(c)).sort((b,c)=>Math.abs((a.par===3?b.carry:b.total)-desired)+({High:0,Medium:3,Low:10}[b.confidence])-Math.abs((a.par===3?c.carry:c.total)-desired)-({High:0,Medium:3,Low:10}[c.confidence]));let c=a.manual<0?ranked[0]:state.bag[a.manual];let good=a.distance>0&&a.distance+a.adjust>0&&a.target>=0&&(a.par===3||a.target<a.distance)&&a.required>=0&&(!dog||a.corner>a.buffer&&a.buffer>=0&&a.corner<a.distance);$('main').innerHTML=`<section><small>${esc(state.courses[state.course].name)}</small><h2>Hole ${state.hole+1}${state.course===0&&state.hole===5?' · CTP':''}</h2><div class="grid"><button id="prev">← Previous</button><button id="next">Next →</button>${field('Hole yards','distance',a.distance)}<div><label>Par</label><select data-field="par">${opts([3,4,5],a.par)}</select></div>${a.par===3?'':field(a.par===5?'Desired second shot':'Desired approach','target',a.target)}${field('Wind / elevation (+ longer)','adjust',a.adjust)}${field('Required carry','required',a.required)}</div>${a.par===3?'':`<label class="sp">Fairway layout</label><div class="grid three">${['Left','Straight','Right'].map(s=>`<button data-shape="${s}" class="${a.shape===s?'active':''}">${s==='Left'?'↰ Left':s==='Right'?'↱ Right':'↑ Straight'}</button>`).join('')}</div>`}${dog?`<div class="grid sp">${field('Distance to turn','corner',a.corner)}${field('Safety buffer','buffer',a.buffer)}</div><p class="muted">Straight-ahead limit: ${limit} yd</p><label><input type="checkbox" id="protect" ${a.protect?'checked':''}> Protect against maximum distance</label>`:''}</section><section><h2>Club selection</h2><button id="auto" class="${a.manual<0?'active':''}">Automatic recommendation</button><div class="clubs sp">${state.bag.map((b,i)=>`<button data-club="${i}" class="${(a.manual<0?c?.i:a.manual)===i?'active':''}" style="${b.enabled?'':'opacity:.55'}">${esc(b.name)}<small>${b.total}</small></button>`).join('')}</div></section>${good&&c&&valid(c)?result(a,c,dog,limit,safe(c)): '<section class="warn">No valid recommendation. Check distances, club settings or manually select a club.</section>'}<section><h2>Compare clubs</h2><table><thead><tr><th>Club</th><th>Carry</th><th>Total</th><th>${a.par===3?'Carry miss':'Left'}</th><th>Limit</th></tr></thead><tbody>${state.bag.map((b,i)=>`<tr data-row="${i}"><td>${esc(b.name)}</td><td>${b.carry}</td><td>${b.total}</td><td>${a.par===3?b.carry-a.distance-a.adjust:Math.max(0,a.distance-b.total+a.adjust)}</td><td>${safe(b)?'✓':'⚠'}</td></tr>`).join('')}</tbody></table><p class="muted">Tap a club row to compare. Distance model only; no GPS or actual hazard mapping.</p></section>`;document.querySelectorAll('[data-field]').forEach(e=>e.onchange=()=>{a[e.dataset.field]=Number(e.value);if(e.dataset.field==='par')a.target=a.par===3?0:a.par===5?220:115;save();render()});document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{a.shape=b.dataset.shape;save();render()});document.querySelectorAll('[data-club],[data-row]').forEach(b=>b.onclick=()=>{a.manual=Number(b.dataset.club??b.dataset.row);save();render()});$('auto').onclick=()=>{a.manual=-1;save();render()};if($('protect'))$('protect').onchange=()=>{a.protect=$('protect').checked;save();render()};$('prev').onclick=()=>{state.hole=Math.max(0,state.hole-1);save();render()};$('next').onclick=()=>{state.hole=Math.min(17,state.hole+1);save();render()};}
function result(a,c,dog,limit,safe){let travel=Math.max(0,c.total-a.adjust),rem=Math.max(0,a.distance-travel),next=state.bag.filter(b=>b.enabled&&valid(b)).sort((b,c)=>Math.abs(b.carry-rem)-Math.abs(c.carry-rem))[0];let turn=dog?Math.max(75,Math.min(240,320-280*a.corner/a.distance)):35,x=dog?(a.shape==='Left'?60:260):160,scale=(320-turn)/(dog?a.corner:a.distance),y=v=>Math.max(12,320-Math.max(0,v-a.adjust)*scale);return `<section><small>${a.manual<0?'RECOMMENDED':'MANUAL SELECTION'}</small><div class="big">${esc(c.name)}</div><p class="muted">${esc(c.confidence)} confidence · ${esc(c.shape)} preferred shape</p>${!safe?'<p class="warn">⚠ Club exceeds a distance constraint or required carry.</p>':''}<div class="grid three"><div><small>Carry</small><h2>${c.carry}</h2></div><div><small>Total</small><h2>${c.total}</h2></div><div><small>Maximum</small><h2>${c.max}</h2></div></div><svg viewBox="0 0 320 350" role="img" aria-label="Schematic shot landing diagram"><rect width="320" height="350" rx="12" fill="#244b34"/><path d="M160 320 L160 ${turn} L${x} 35" stroke="#537d4b" stroke-width="76" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M160 320 L160 ${turn} L${x} 35" stroke="#94b97b" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" fill="none"/><ellipse cx="${x}" cy="35" rx="28" ry="20" fill="#c5dea3"/><path d="M${x} 35 v-23 l16 6 l-16 6" stroke="white" fill="#e87058"/>${dog?`<line x1="121" x2="199" y1="${turn}" y2="${turn}" stroke="#ffbf80" stroke-dasharray="4 4"/><text x="${x===60?240:70}" y="${turn+5}" fill="white" text-anchor="middle" font-size="12">Turn ${a.corner}</text>`:''}<line x1="160" x2="160" y1="320" y2="${y(c.max)}" stroke="#ffe18c" stroke-dasharray="4 4"/><line x1="160" x2="160" y1="320" y2="${y(c.total)}" stroke="#ffe18c" stroke-width="3"/><circle cx="160" cy="${y(c.max)}" r="7" fill="none" stroke="#ffe18c"/><circle cx="160" cy="${y(c.carry)}" r="4" fill="white"/><circle cx="160" cy="${y(c.total)}" r="6" fill="#ffe18c"/><text x="175" y="${Math.max(25,y(c.total))}" font-size="12" fill="white">${Math.round(travel)} yd</text><text x="160" y="340" text-anchor="middle" font-size="12" fill="white">TEE</text></svg><p class="muted">○ Maximum · ● Total · white dot = carry</p><small>${a.par===3?'Carry relative to pin':'REMAINING DISTANCE'}</small><div class="big">${a.par===3?`${c.carry-a.distance-a.adjust} yd`:rem+' yd'}</div>${a.par!==3&&next&&rem>0?`<p>Next club: <b>${esc(next.name)}</b>${rem<Math.min(...state.bag.filter(b=>b.enabled&&valid(b)).map(b=>b.carry))?' · partial swing':''}</p>`:''}</section>`}
function bag(){ $('main').innerHTML=`<section><h2>My golf bag</h2><p class="muted">Carry ≤ total ≤ maximum. All distances in yards. Shot shape is informational.</p>${state.bag.map((b,i)=>`<div class="clubedit"><div class="grid"><div><label>Club</label><input data-i="${i}" data-k="name" value="${esc(b.name)}"></div><label><input type="checkbox" data-i="${i}" data-k="enabled" ${b.enabled?'checked':''}> Enabled</label></div><div class="grid three sp">${['carry','total','max'].map(k=>`<div><label>${k}</label><input type="number" data-i="${i}" data-k="${k}" value="${b[k]}"></div>`).join('')}</div><div class="grid sp"><div><label>Confidence</label><select data-i="${i}" data-k="confidence">${opts(['High','Medium','Low'],b.confidence)}</select></div><div><label>Shot shape</label><select data-i="${i}" data-k="shape">${opts(['Straight','Draw','Fade'],b.shape)}</select></div></div>${valid(b)?'':'<p class="warn">Invalid distances</p>'}</div>`).join('')}<button class="sp" id="add">+ Add club</button><button class="sp" id="restore">Restore original bag</button></section>`;document.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{state.bag[+e.dataset.i][e.dataset.k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value;save();render()});$('add').onclick=()=>{state.bag.push({name:'New',carry:90,total:95,max:105,enabled:true,confidence:'Medium',shape:'Straight'});save();render()};$('restore').onclick=()=>{if(confirm('Replace all club edits?')){state.bag=bagDefault();state.courses.forEach(c=>c.holes.forEach(h=>h.manual=-1));save();render()}}}
function courses(){ $('main').innerHTML=`<section><h2>Saved courses</h2>${state.courses.map((c,i)=>`<button class="sp ${i===state.course?'active':''}" data-course="${i}">${esc(c.name)}</button>`).join('')}<div class="sp"><label>New course name</label><input id="newname" placeholder="Course name"><button class="sp" id="newcourse">Create 18-hole course</button></div></section><section><h2>Backup & restore</h2><button id="export">Export JSON backup</button><label class="sp">Import backup (replaces current data)</label><input type="file" id="import" accept="application/json,.json"><p class="muted">Stored on this device. Export before clearing browser data.</p></section>`;document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{state.course=+b.dataset.course;state.hole=0;page='Planner';save();render()});$('newcourse').onclick=()=>{let name=$('newname').value.trim();if(!name)return;state.courses.push({name,holes:Array.from({length:18},()=>holeDefault())});state.course=state.courses.length-1;state.hole=0;save();page='Planner';render()};$('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='atlas-caddie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async()=>{try{let s=JSON.parse(await $('import').files[0].text());if(!Array.isArray(s.bag)||!s.bag.length||!s.bag.every(b=>typeof b.name==='string'&&valid(b))||!Array.isArray(s.courses)||!s.courses.length||!s.courses.every(c=>typeof c.name==='string'&&Array.isArray(c.holes)&&c.holes.length===18))throw Error();if(confirm('Replace your current data?')){state=s;state.course=0;state.hole=0;save();render()}}catch(e){alert('Invalid backup file')}}}
function quick(){let clubs=state.bag.filter(b=>b.enabled&&valid(b)).sort((b,c)=>Math.abs(b.carry-state.quick)-Math.abs(c.carry-state.quick));$('main').innerHTML=`<section><h2>Quick shot</h2><label>Playing distance (carry yards)</label><input id="quick" type="number" min="1" value="${state.quick}"><div class="sp" id="quickresult"></div></section>`;const update=()=>{let n=Number($('quick').value);if(n<=0){$('quickresult').textContent='Enter a positive distance';return}state.quick=n;save();$('quickresult').innerHTML=clubs.sort((b,c)=>Math.abs(b.carry-n)-Math.abs(c.carry-n)).slice(0,3).map((b,i)=>`<p>${i===0?'Recommended: ':''}<b>${esc(b.name)}</b> · ${b.carry} carry (${b.carry-n>=0?'+':''}${b.carry-n} yd)</p>`).join('')||'No enabled clubs'};$('quick').oninput=update;update()}
render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
