<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Atlas Caddie</title><style>
:root{color-scheme:light dark;--green:#276849;--bg:#f1f4ef;--panel:#fff;--ink:#19352a;--line:#d6dfd5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#173e30;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 18px}header h1{margin:0;font-size:29px;letter-spacing:-1px}small,label{font-size:12px;opacity:.8}main{max-width:560px;margin:auto;padding:14px 14px 100px}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}h2{font-size:19px;margin:0 0 12px}label{display:block;margin-bottom:5px}input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;min-width:0;background:var(--panel);width:100%;min-height:44px}button{cursor:pointer;font-weight:600}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{grid-template-columns:repeat(3,1fr)}.clubs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.clubs button{padding:7px 2px}.clubs small{display:block}nav{position:fixed;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;width:100%;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px;z-index:5}nav button{border:0;font-size:13px}.big{font-size:30px;font-weight:750;letter-spacing:-1px}.muted{font-size:13px;opacity:.75}.warn{color:#a65c13;font-weight:600}.sp{margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:10px 3px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}svg{width:100%;max-height:310px;display:block}input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle}.clubedit{border-bottom:1px solid var(--line);padding:14px 0}@media(prefers-color-scheme:dark){:root{--bg:#101a15;--panel:#1b2a22;--ink:#edf4eb;--line:#3a5042}.warn{color:#ffc183}}
</style></head><body><header><small>PERSONAL COURSE MANAGEMENT · V5.4</small><h1>⛳ Atlas Caddie</h1></header><main id="main"></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bagDefault=()=>[['D',240,260,300],['3W',218,228,240],['4i',178,190,205],['5i',183,193,200],['6i',178,188,195],['7i',163,173,180],['8i',148,158,165],['9i',133,143,150],['PW',123,128,135],['GW',110,115,125]].map(([name,carry,total,max])=>({name,carry,total,max,enabled:true,confidence:'Medium',shape:'Straight'}));
const holeDefault=(distance=350,par=4)=>({distance,par,target:par===3?0:par===5?220:115,shape:'Straight',corner:220,buffer:10,adjust:0,required:0,protect:true,manual:-1});
const initial=()=>({bag:bagDefault(),current:holeDefault(),quick:150,quickAdjust:0,quickCarry:0});
let state;try{let old=JSON.parse(localStorage.getItem('atlas-caddie-v1'));state=old?{...initial(),bag:old.bag||bagDefault(),current:old.current||holeDefault(),quick:old.quick||150,quickAdjust:old.quickAdjust||0,quickCarry:old.quickCarry||0}:initial()}catch(e){state=initial()}let page='Planner';const save=()=>{try{localStorage.setItem('atlas-caddie-v1',JSON.stringify(state))}catch(e){alert('Local saving unavailable. Export a backup.')}};const h=()=>state.current;const valid=a=>a.carry>0&&a.total>=a.carry&&a.max>=a.total;const field=(label,key,value,type='number')=>`<div><label>${label}</label><input type="${type}" data-field="${key}" value="${esc(value)}"></div>`;const opts=(values,current)=>values.map(v=>`<option ${v==current?'selected':''}>${esc(v)}</option>`).join('');
function render(){ $('nav').innerHTML=['Planner','Quick','My Bag'].map(p=>`<button class="${page===p?'active':''}" data-page="${p}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='Planner')planner();if(page==='My Bag')bag();if(page==='Quick')quick();}
function planner(){let a=h(),dog=a.par!=3&&a.shape!=='Straight',limit=dog?a.corner-a.buffer:Infinity,desired=a.par===3?a.distance+a.adjust:Math.min(a.distance-a.target,limit)+a.adjust;let safe=c=>valid(c)&&c.carry-a.adjust>=a.required&&(!dog||(a.protect?c.max:c.total)-a.adjust<=limit);let ranked=state.bag.map((c,i)=>({...c,i})).filter(c=>c.enabled&&safe(c)).sort((b,c)=>Math.abs((a.par===3?b.carry:b.total)-desired)+({High:0,Medium:3,Low:10}[b.confidence])-Math.abs((a.par===3?c.carry:c.total)-desired)-({High:0,Medium:3,Low:10}[c.confidence]));let c=a.manual<0?ranked[0]:state.bag[a.manual];let good=a.distance>0&&a.distance+a.adjust>0&&a.target>=0&&(a.par===3||a.target<a.distance)&&a.required>=0&&(!dog||a.corner>a.buffer&&a.buffer>=0&&a.corner<a.distance);$('main').innerHTML=`<section><small>ANY COURSE · ANY HOLE</small><h2>Hole planner</h2><button id="resetHole">New hole / reset</button><div class="grid sp">${field('Hole yards','distance',a.distance)}<div><label>Par</label><select data-field="par">${opts([3,4,5],a.par)}</select></div>${a.par===3?'':field(a.par===5?'Desired second shot':'Desired approach','target',a.target)}${field('Wind / elevation (+ longer)','adjust',a.adjust)}${field('Required carry','required',a.required)}</div>${a.par===3?'':`<label class="sp">Fairway layout</label><div class="grid three">${['Left','Straight','Right'].map(s=>`<button data-shape="${s}" class="${a.shape===s?'active':''}">${s==='Left'?'↰ Left':s==='Right'?'↱ Right':'↑ Straight'}</button>`).join('')}</div>`}${dog?`<div class="grid sp">${field('Distance to turn','corner',a.corner)}${field('Safety buffer','buffer',a.buffer)}</div><p class="muted">Straight-ahead limit: ${limit} yd</p><label><input type="checkbox" id="protect" ${a.protect?'checked':''}> Protect against maximum distance</label>`:''}</section><section><h2>Club selection</h2><button id="auto" class="${a.manual<0?'active':''}">Automatic recommendation</button><div class="clubs sp">${state.bag.map((b,i)=>`<button data-club="${i}" class="${(a.manual<0?c?.i:a.manual)===i?'active':''}" style="${b.enabled?'':'opacity:.55'}">${esc(b.name)}<small>${b.total}</small></button>`).join('')}</div></section>${good?mapPanel(a,c,dog,limit):''}${good&&c&&valid(c)?result(a,c,dog,limit,safe(c)): '<section class="warn">No valid recommendation. Check distances, club settings or manually select a club.</section>'}<section><h2>Compare clubs</h2><table><thead><tr><th>Club</th><th>Carry</th><th>Total</th><th>${a.par===3?'Carry miss':'Left'}</th><th>Limit</th></tr></thead><tbody>${state.bag.map((b,i)=>`<tr data-row="${i}"><td>${esc(b.name)}</td><td>${b.carry}</td><td>${b.total}</td><td>${a.par===3?b.carry-a.distance-a.adjust:Math.max(0,a.distance-b.total+a.adjust)}</td><td>${safe(b)?'✓':'⚠'}</td></tr>`).join('')}</tbody></table><p class="muted">Tap a club row to compare. Distance model only; no GPS or actual hazard mapping.</p></section>`;document.querySelectorAll('[data-field]').forEach(e=>e.onchange=()=>{a[e.dataset.field]=Number(e.value);delete a.aim;if(e.dataset.field==='par')a.target=a.par===3?0:a.par===5?220:115;save();render()});document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{a.shape=b.dataset.shape;delete a.aim;save();render()});document.querySelectorAll('[data-club],[data-row]').forEach(b=>b.onclick=()=>{a.manual=Number(b.dataset.club??b.dataset.row);save();render()});$('auto').onclick=()=>{a.manual=-1;save();render()};if($('protect'))$('protect').onchange=()=>{a.protect=$('protect').checked;save();render()};$('resetHole').onclick=()=>{state.current=holeDefault();save();render()};bindMap(a,dog,limit);}
function geometry(a,dog){let angle=dog?Math.PI/4:0, sign=a.shape==='Left'?-1:1, first=dog?a.corner:a.distance, second=dog?a.distance-first:0, dx=sign*second*Math.sin(angle),dy=first+second*Math.cos(angle),scale=Math.min(270/dy,110/Math.max(Math.abs(dx),1));let tee={x:160,y:315},bend={x:160,y:315-first*scale},green={x:160+dx*scale,y:315-dy*scale};return {tee,bend,green,first,scale};}
function mapPanel(a,c,dog,limit){let g=geometry(a,dog);return `<section><h2>Interactive landing map</h2><p class="muted">Tap or drag anywhere to aim. Both directions are measured on the same yardage scale.</p><svg id="landingMap" viewBox="0 0 320 350" style="touch-action:none;user-select:none;max-height:420px" aria-label="Two-dimensional schematic fairway"><rect width="320" height="350" rx="12" fill="#244b34"/><path d="M160 315 L${g.bend.x} ${g.bend.y} L${g.green.x} ${g.green.y}" stroke="#537d4b" stroke-width="76" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M160 315 L${g.bend.x} ${g.bend.y} L${g.green.x} ${g.green.y}" stroke="#94b97b" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" fill="none"/><ellipse cx="${g.green.x}" cy="${g.green.y}" rx="24" ry="18" fill="#c5dea3"/><path d="M${g.green.x} ${g.green.y} v-23 l16 6 l-16 6" stroke="white" fill="#e87058"/>${dog?`<text x="160" y="${g.bend.y-8}" fill="white" text-anchor="middle" font-size="11">Turn ${g.first} yd</text>`:''}<g id="aimMarker"></g><circle cx="160" cy="315" r="4" fill="white"/><text x="160" y="340" text-anchor="middle" font-size="12" fill="white">TEE</text></svg><p class="muted">Green = clear · Yellow = caution · Red = warning · Gold = club total · Ring = maximum · White = carry</p><div class="grid"><div><label>Target from tee (yd)</label><input id="aimDistance" type="number" min="1"></div><div><small>Remaining direct to green</small><div class="big" id="aimLeft"></div></div></div><div id="aimOffset" class="muted sp"></div><div id="aimWarning" role="status" class="sp" style="padding:12px;border:2px solid;border-radius:10px;font-weight:600"></div><div id="aimClub" class="sp"></div><button id="applyAim" class="primary sp">Select suggested club</button><p class="muted">Illustrative 45° dogleg. Direct distances are geometric estimates, not GPS. Corner clearance and actual hazards are unknown. Straight-ahead safety limit remains conservative for all aim directions.</p></section>`;}
function targetStatus(x,y,g,a,m,limit){const segment=(p,q)=>{let u=q.x-p.x,v=q.y-p.y,t=Math.max(0,Math.min(1,((x-p.x)*u+(y-p.y)*v)/(u*u+v*v||1)));return Math.hypot(x-p.x-t*u,y-p.y-t*v)};let edge=Math.min(segment(g.tee,g.bend),segment(g.bend,g.green));let onGreen=((x-g.green.x)/24)**2+((y-g.green.y)/18)**2<=1;let target=Math.hypot(x-g.tee.x,y-g.tee.y)/g.scale;let red=[],yellow=[];if(!onGreen&&edge>24)red.push(edge>38?'Outside illustrated fairway and rough corridor':'Target in illustrated rough');else if(!onGreen&&edge>19)yellow.push('Near fairway edge');if(y>g.tee.y||((x-g.green.x)*(g.green.x-(g.first===a.distance?g.tee.x:g.bend.x))+(y-g.green.y)*(g.green.y-(g.first===a.distance?g.tee.y:g.bend.y))>0&&!onGreen&&Math.hypot(x-g.green.x,y-g.green.y)>24))red.push('Beyond illustrated hole boundary');if(!m||!valid(m))red.push('No eligible club');else {let typical=(a.par===3?m.carry:m.total)-a.adjust;if(target>m.max-a.adjust)red.push('Beyond '+m.name+' maximum range');else if(target>typical+0.01)yellow.push('Beyond '+m.name+' normal distance');if(m.carry-a.adjust<a.required)red.push('Required carry not met');}if(target>limit)yellow.push('Beyond conservative dogleg limit');return {color:red.length?'#ef4444':yellow.length?'#eab308':'#22c55e',label:red.length?'WARNING':yellow.length?'CAUTION':'CLEAR',reasons:[...red,...yellow]};}
function bindMap(a,dog,limit){let svg=$('landingMap');if(!svg)return;let g=geometry(a,dog),s=g.scale, suggested=-1;let initial=Math.min(a.distance,Math.max(1,a.distance-a.target)), pos=a.aim&&Number.isFinite(a.aim.x)&&Number.isFinite(a.aim.y)?a.aim:{x:160,y:315-initial*s};const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));function update(x,y){x=clamp(x,8,312);y=clamp(y,8,330);pos={x,y};let dx=x-160,dy=y-315,r=Math.hypot(dx,dy),target=r/s,remaining=Math.hypot(x-g.green.x,y-g.green.y)/s;let safe=b=>valid(b)&&b.enabled&&b.carry-a.adjust>=a.required&&(!dog||(a.protect?b.max:b.total)-a.adjust<=limit);let ranked=state.bag.map((b,i)=>({...b,i})).filter(safe).sort((b,c)=>Math.abs((a.par===3?b.carry:b.total)-a.adjust-target)-Math.abs((a.par===3?c.carry:c.total)-a.adjust-target));let b=ranked[0],m=a.manual>=0?state.bag[a.manual]:b;suggested=b?.i??-1;let at=v=>({x:160+dx/Math.max(r,.001)*Math.max(0,v-a.adjust)*s,y:315+dy/Math.max(r,.001)*Math.max(0,v-a.adjust)*s});let marker=(v,rad,fill,stroke)=>{let p=at(v);return `<circle cx="${p.x}" cy="${p.y}" r="${rad}" fill="${fill}" stroke="${stroke}"/>`};let status=targetStatus(x,y,g,a,m,limit);let warning=$('aimWarning');warning.style.borderColor=status.color;warning.textContent=status.label+' — '+(status.reasons.join(' · ')||'Within illustrated fairway and club range');$('aimMarker').innerHTML=`<line x1="160" y1="315" x2="${x}" y2="${y}" stroke="${status.color}" stroke-dasharray="5 4"/><line x1="${x}" y1="${y}" x2="${g.green.x}" y2="${g.green.y}" stroke="white" opacity=".7" stroke-dasharray="4 4"/>${m&&valid(m)?marker(m.max,8,'none','#ffe18c')+marker(m.carry,4,'white','white')+marker(m.total,6,'#ffe18c','white'):''}<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${status.color}" stroke-width="2"/><path d="M${x-18} ${y} H${x+18} M${x} ${y-18} V${y+18}" stroke="${status.color}" stroke-width="2"/>`;$('aimDistance').value=Math.round(target);$('aimLeft').textContent=Math.round(remaining)+' yd';$('aimOffset').textContent=Math.round(Math.abs(dx)/s)+' yd '+(dx<0?'left':dx>0?'right':'off center')+' of tee line';$('aimClub').innerHTML=b?`<b>Closest club within constraints: ${esc(b.name)}</b><div class="muted">${b.carry} carry · ${b.total} total · ${Math.round((a.par===3?b.carry:b.total)-a.adjust-target)} yd vs target</div>`:'<span class="warn">No enabled club meets constraints.</span>';if(dog&&target>limit)$('aimClub').innerHTML+='<p class="warn">Beyond conservative dogleg limit. Verify corner clearance yourself.</p>';if(m&&a.manual>=0)$('aimClub').innerHTML+=`<p>Manual ${esc(m.name)}: ${Math.round(m.total-a.adjust-target)} yd vs target (total)</p>`;$('applyAim').disabled=suggested<0;}function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());update(q.x,q.y)}function persist(){a.aim=pos;save()}svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);point(e)};svg.onpointermove=e=>{if(svg.hasPointerCapture(e.pointerId))point(e)};svg.onpointerup=e=>{point(e);persist();svg.releasePointerCapture(e.pointerId)};svg.onpointercancel=persist;$('aimDistance').onchange=e=>{let r=Math.hypot(pos.x-160,pos.y-315),n=Math.max(0,Number(e.target.value))*s;update(160+(r? (pos.x-160)/r*n:0),315+(r?(pos.y-315)/r*n:-n));persist()};$('applyAim').onclick=()=>{if(suggested>=0){a.manual=suggested;persist();render()}};update(pos.x,pos.y);}
function result(a,c,dog,limit,safe){let travel=Math.max(0,c.total-a.adjust),rem=Math.max(0,a.distance-travel),next=state.bag.filter(b=>b.enabled&&valid(b)).sort((b,c)=>Math.abs(b.carry-rem)-Math.abs(c.carry-rem))[0];let turn=dog?Math.max(75,Math.min(240,320-280*a.corner/a.distance)):35,x=dog?(a.shape==='Left'?60:260):160,scale=(320-turn)/(dog?a.corner:a.distance),y=v=>Math.max(12,320-Math.max(0,v-a.adjust)*scale);return `<section><small>${a.manual<0?'RECOMMENDED':'MANUAL SELECTION'}</small><div class="big">${esc(c.name)}</div><p class="muted">${esc(c.confidence)} confidence · ${esc(c.shape)} preferred shape</p>${!safe?'<p class="warn">⚠ Club exceeds a distance constraint or required carry.</p>':''}<div class="grid three"><div><small>Carry</small><h2>${c.carry}</h2></div><div><small>Total</small><h2>${c.total}</h2></div><div><small>Maximum</small><h2>${c.max}</h2></div></div><small>${a.par===3?'Carry relative to pin':'REMAINING DISTANCE'}</small><div class="big">${a.par===3?`${c.carry-a.distance-a.adjust} yd`:rem+' yd'}</div>${a.par!==3&&next&&rem>0?`<p>Next club: <b>${esc(next.name)}</b>${rem<Math.min(...state.bag.filter(b=>b.enabled&&valid(b)).map(b=>b.carry))?' · partial swing':''}</p>`:''}</section>`}
function bag(){ $('main').innerHTML=`<section><h2>My golf bag</h2><p class="muted">Carry ≤ total ≤ maximum. All distances in yards. Shot shape is informational.</p>${state.bag.map((b,i)=>`<div class="clubedit"><div class="grid"><div><label>Club</label><input data-i="${i}" data-k="name" value="${esc(b.name)}"></div><label><input type="checkbox" data-i="${i}" data-k="enabled" ${b.enabled?'checked':''}> Enabled</label></div><div class="grid three sp">${['carry','total','max'].map(k=>`<div><label>${k}</label><input type="number" data-i="${i}" data-k="${k}" value="${b[k]}"></div>`).join('')}</div><div class="grid sp"><div><label>Confidence</label><select data-i="${i}" data-k="confidence">${opts(['High','Medium','Low'],b.confidence)}</select></div><div><label>Shot shape</label><select data-i="${i}" data-k="shape">${opts(['Straight','Draw','Fade'],b.shape)}</select></div></div>${valid(b)?'':'<p class="warn">Invalid distances</p>'}</div>`).join('')}<button class="sp" id="add">+ Add club</button><button class="sp" id="restore">Restore original bag</button></section><section><h2>Backup & restore</h2><button id="export">Export JSON backup</button><label class="sp">Import backup</label><input type="file" id="import" accept="application/json,.json"></section>`;document.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{state.bag[+e.dataset.i][e.dataset.k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value;save();render()});$('add').onclick=()=>{state.bag.push({name:'New',carry:90,total:95,max:105,enabled:true,confidence:'Medium',shape:'Straight'});save();render()};$('restore').onclick=()=>{if(confirm('Replace all club edits?')){state.bag=bagDefault();state.current.manual=-1;save();render()}}; $('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='atlas-caddie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async()=>{try{let s=JSON.parse(await $('import').files[0].text());if(!Array.isArray(s.bag)||!s.bag.length||!s.bag.every(b=>typeof b.name==='string'&&valid(b)))throw Error();if(confirm('Replace your golf bag?')){state.bag=s.bag;state.current.manual=-1;save();render()}}catch(e){alert('Invalid backup file')}};}
function quick(){let clubs=state.bag.filter(b=>b.enabled&&valid(b));$('main').innerHTML=`<section><h2>Quick shot</h2><label>Distance to target (yds)</label><input id="quick" type="number" min="1" value="${state.quick}"><div class="grid sp"><div><label>Wind / elevation (+ longer)</label><input id="qa" type="number" value="${state.quickAdjust}"></div><div><label>Required carry</label><input id="qc" type="number" min="0" value="${state.quickCarry}"></div></div><div class="sp" id="quickresult"></div></section>`;const update=()=>{let n=Number($('quick').value),a=Number($('qa').value),r=Number($('qc').value);if(n<=0||n+a<=0||r<0){$('quickresult').textContent='Check distances';return}state.quick=n;state.quickAdjust=a;state.quickCarry=r;save();$('quickresult').innerHTML=clubs.filter(b=>b.carry-a>=r).sort((b,c)=>Math.abs(b.carry-n-a)-Math.abs(c.carry-n-a)).slice(0,3).map((b,i)=>`<p>${i===0?'Recommended: ':''}<b>${esc(b.name)}</b> · ${b.carry} carry (${b.carry-n-a>=0?'+':''}${b.carry-n-a} yd)</p>`).join('')||'No enabled club meets required carry'};['quick','qa','qc'].forEach(k=>$(k).oninput=update);update()}

render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
